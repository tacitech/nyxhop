[package]
name = "nyx-tx"
version = "0.1.0"
edition = "2024"

# The window binary; the library also builds headless (an on-board camera app hosts it).
[[bin]]
name = "nyx-tx"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "h264", "webcam", "rtsp", "onvif"]
# The window (TxApp). Off in an on-board camera app, which runs headless.
gui = ["dep:eframe", "dep:egui"]
# The H.264 encoder (openh264). Without it only MJPEG and the IP camera's own H.264
# (pass-through) can be sent.
h264 = ["nyx-common/h264"]
webcam = ["nyx-common/webcam"]
rtsp = ["nyx-common/rtsp", "rtsp-client", "h264"]
# The RTSP client alone, for pass-through without a decoder.
rtsp-client = ["nyx-common/rtsp-client"]
# The pass-through camera's bitrate follows the link through ONVIF.
onvif = ["nyx-common/onvif"]

[dependencies]
egui = { version = "0.35.0", optional = true }
num-complex = { workspace = true }
nyx-link = { path = "../../../link/nyx-link" }
nyx-proto = { path = "../../../link/nyx-proto" }
nyx-common = { path = "../../../link/nyx-common", default-features = false }

# The PC window renders with wgpu (v40.21: OpenGL (glow) crashed in Intel's igxelpgicd64.dll,
# 5 times in 6 days). On the phone the crate is a library hosted by nyx-mobile, which
# renders with glow through the NativeActivity.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35.0", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35.0", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
