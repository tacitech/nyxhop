[package]
name = "nyx-common"
version = "0.1.0"
edition = "2024"

[features]
default = ["h264"]
# h264 = openh264 (C++ qua cc) — TAT cho Android/no-std-ish build
# (MJPEG thuan Rust qua `image` van chay).
h264 = ["dep:openh264", "dep:openh264-sys2"]
webcam = ["dep:nokhwa"]
# IP camera over RTSP (retina: pure Rust, so it builds for Android too). Decodes with
# openh264, hence h264.
rtsp = ["h264", "dep:retina", "dep:tokio", "dep:futures", "dep:url"]

[dependencies]
egui = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10.11", optional = true, features = ["input-native"] }
nyx-proto = { path = "../nyx-proto" }
openh264 = { version = "0.9.3", optional = true }
# v40.25: SetOption(BITRATE) doi rate KHONG dung lai encoder (openh264 khong boc)
openh264-sys2 = { version = "0.9.6", optional = true }
retina = { version = "0.4", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "macros"] }
futures = { version = "0.3", optional = true }
url = { version = "2", optional = true }
