# Boot configuration for ADRV9364-Z7020 as the receiving (ground) end: one console command per line,
# applied by the start-up script once the radio daemon is up (# starts a comment).
# Channel tables and the channel mode you set later from the app win over this file.
# The README explains the tables; the console takes the same commands at run time.

rxfreq 5735000000
txfreq 5835000000
txgain 0
agc manual
rxgain 60
trig rmin 5
trig shift 2
trig tail 2048
trig refr 3072
iqsink 1
rx2 1
softagc 1
ctltx 1
txmute 0
hop chans 5735,5755,5775,5795,5815
hop ctlchans 2412,2432,2452,2472
hop ctl 8
hop auto rx 1000
ctlhop tx 1
hopallow 1
erase 1
